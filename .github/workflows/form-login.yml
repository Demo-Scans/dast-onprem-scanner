name: DAST Scan Form Authentication

on:
  workflow_dispatch:
    inputs:
      scanner_depth:
        description: 'Scanner Depth'
        options: 
        - baseline
        - full
        type: choice
      sensitivity_level:
        description: 'Sensitivity vulnerability level'
        options: 
        - soft
        - medium
        - strong
        type: choice
      require_authentication:
        type: boolean
        description: 'Whether or not to run authenticated analyses'

jobs:
  iris-scanner:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
       
      - name: Create Settings File
        run: |
          $jsonContent = @{
            assetId = "${{ secrets.IRIS_ASSET_ID }}"
            token = "${{ secrets.IRIS_TOKEN }}"
            authEndpoint = "${{ secrets.APP_AUTH_ENDPOINT }}"
            username = "${{ secrets.APP_USERNAME }}"
            password = "${{ secrets.APP_PASSWORD }}"
          } | ConvertTo-Json

          $jsonContent | Set-Content -Path "iris.settings.json"
          
      - name: Download IRIS Scanner CLI 
        shell: powershell
        run: Invoke-WebRequest -Uri "https://iris.codeeye.ai/assets/onprem/dast/win/iris-scanner.exe" -OutFile "iris-scanner.exe"

      - name: Run Scan 
        shell: powershell
        run: |
          .\iris-scanner.exe scan --url "${{ secrets.APP_DOMAIN }}" --mode "${{ github.event.inputs.scanner_depth }}" ${{ fromJSON('["", "--authenticated"]')[github.event.inputs.require_authentication == 'true'] }} --sensitivity "${{ github.event.inputs.sensitivity_level }}" 
