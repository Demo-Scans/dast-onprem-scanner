name: DAST Scan Form Authentication With 2FA / TOTP Token
on:
  workflow_dispatch:
    inputs:
      scanner_depth:
        description: 'Scanner Depth'
        options: 
        - baseline
        - full
        type: choice
jobs:
  iris-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
      
      - name: Create Settings File
        run: |
          cat > iris.settings.json <<EOF
          {
            "assetId": "${{ secrets.IRIS_ASSET_ID }}",
            "token": "${{ secrets.IRIS_TOKEN }}",
            "authEndpoint": "${{ secrets.APP_AUTH_ENDPOINT }}",
            "username": "${{ secrets.APP_USERNAME }}",
            "password": "${{ secrets.APP_PASSWORD }}",
            "totpSecret": "${{ secrets.APP_TOTP_SECRET }}"
          }
          EOF
      
      - name: Download IRIS Scanner CLI
        run: |
          curl -L -o iris-scanner "https://iris.codeeye.ai/assets/onprem/dast/linux/iris-scanner"
          chmod +x iris-scanner
      
      - name: Run Scan
        run: |
          ./iris-scanner scan --url "${{ secrets.APP_DOMAIN }}" --mode "${{ github.event.inputs.scanner_depth }}" --authenticated
